<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Maison — prova de mesa AR</title>
<style>
body{margin:0;background:#111;color:#f5e9d5;font:15px system-ui}#panel{position:fixed;z-index:3;top:0;left:0;right:0;padding:16px;background:#111e;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{background:#c9a66b;color:#15110b;border:0;padding:11px;border-radius:6px}#status{width:100%;font-size:13px}#hint{position:fixed;z-index:2;bottom:24px;left:20px;right:20px;text-align:center;background:#111b;padding:12px;border-radius:8px}canvas{display:block}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body>
<div id="panel"><strong>MAISON · Prova AR</strong><label>Prato recortado (PNG/WebP) <input id="photo" type="file" accept="image/png,image/webp"></label><label>Diâmetro (cm) <input id="diameter" type="number" min="10" max="60" value="28" style="width:60px"></label><div id="status" role="status">Carregue uma foto com transparência. Requer Android compatível com WebXR AR e HTTPS.</div></div>
<div id="hint">Aponte para a mesa, mova o celular lentamente e toque na tela para posicionar o prato.</div>
<script type="module">
import * as THREE from 'three';
import {ARButton} from 'three/addons/webxr/ARButton.js';
const status=document.querySelector('#status'), photo=document.querySelector('#photo'), diameter=document.querySelector('#diameter');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera();
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2));
const reticle=new THREE.Mesh(new THREE.RingGeometry(.07,.085,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xd3ae75}));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
let dish=null,hitTestSource=null,referenceSpace=null,textureUrl=null,photoAspect=1;
function setStatus(s){status.textContent=s}
function setDish(texture){if(dish){scene.remove(dish);dish.geometry.dispose();dish.material.dispose()}const size=Number(diameter.value)/100;const material=new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide});dish=new THREE.Mesh(new THREE.PlaneGeometry(size,size/photoAspect).rotateX(-Math.PI/2),material);dish.visible=false;scene.add(dish)}
photo.addEventListener('change',()=>{const file=photo.files?.[0];if(!file)return;if(!['image/png','image/webp'].includes(file.type)){setStatus('Envie PNG ou WebP com transparência.');return}if(textureUrl)URL.revokeObjectURL(textureUrl);textureUrl=URL.createObjectURL(file);new THREE.TextureLoader().load(textureUrl,t=>{t.colorSpace=THREE.SRGBColorSpace;photoAspect=t.image.width/t.image.height;setDish(t);setStatus('Imagem carregada. Entre em AR e aponte para a mesa.')},undefined,()=>setStatus('Erro ao abrir a imagem.'))});
diameter.addEventListener('change',()=>{if(dish){const size=Number(diameter.value)/100;dish.geometry.dispose();dish.geometry=new THREE.PlaneGeometry(size,size).rotateX(-Math.PI/2)}});
const button=ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});document.body.append(button);if(!window.isSecureContext)setStatus('Esta prova exige HTTPS para usar realidade aumentada.');else if(!navigator.xr)setStatus('WebXR não está disponível neste navegador. Use Android com Chrome e ARCore compatíveis.');
renderer.xr.addEventListener('sessionstart',()=>setStatus('AR iniciado. Procure uma superfície horizontal e toque para posicionar.'));
renderer.xr.addEventListener('sessionend',()=>{hitTestSource?.cancel();hitTestSource=null;referenceSpace=null;reticle.visible=false;setStatus('Sessão encerrada.')});
function placeDish(){if(!dish){setStatus('Primeiro carregue a foto real do prato.');return}if(!reticle.visible){setStatus('Mesa ainda não detectada. Mova o celular lentamente.');return}dish.position.setFromMatrixPosition(reticle.matrix);dish.quaternion.setFromRotationMatrix(reticle.matrix);dish.visible=true;setStatus('Prato posicionado na superfície detectada. Confira escala e estabilidade.')}
const controller=renderer.xr.getController(0);controller.addEventListener('select',placeDish);scene.add(controller);
renderer.domElement.addEventListener('click',()=>{if(renderer.xr.isPresenting)placeDish()});
renderer.setAnimationLoop(async(_time,frame)=>{if(frame){if(!hitTestSource){const session=renderer.xr.getSession();try{const viewer=await session.requestReferenceSpace('viewer');hitTestSource=await session.requestHitTestSource({space:viewer});referenceSpace=renderer.xr.getReferenceSpace()}catch(e){setStatus('Não foi possível iniciar a detecção da mesa neste aparelho.');return}}if(!hitTestSource||!referenceSpace){renderer.render(scene,camera);return}const hits=frame.getHitTestResults(hitTestSource);if(hits.length){const pose=hits[0].getPose(referenceSpace);if(pose){reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix)}}else reticle.visible=false}renderer.render(scene,camera)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
