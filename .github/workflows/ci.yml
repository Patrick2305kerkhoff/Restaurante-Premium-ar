name: CI (build, testes e capturas reais)
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Navegador para o teste funcional
        run: npx playwright install --with-deps chromium
      - name: Teste funcional de ponta a ponta + capturas
        run: npm run e2e
        env:
          E2E_OUT: screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-reais
          path: screenshots/
          if-no-files-found: warn
