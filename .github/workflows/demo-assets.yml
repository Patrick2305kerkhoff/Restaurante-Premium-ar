name: Demo assets (fotos e modelos 3D)
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/demo-sources.json
permissions:
  contents: write
concurrency:
  group: demo-assets-${{ github.ref }}
jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Baixar, otimizar e gerar modelos GLB
        run: node scripts/demo-assets.mjs --only=heroes
      - name: Commit dos assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/demo
          git diff --cached --quiet || git commit -m "Atualiza imagens demonstrativas e modelos 3D"
          git push
